name: Character Core and Worker Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core-tests:
    name: Core Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install free optional sprite library for real PNG atlas tests
        run: python -m pip install "Pillow>=11,<13"
      - name: Compile pure Python and bundled bridge
        run: python -m compileall -q src blender_bridge
      - name: Core/worker/library tests (no Blender)
        run: python -m unittest discover -s tests -v
      - name: Earlier preflight tests
        run: python -m unittest discover -s Stage0_Starter/tests -v
      - name: Earlier evidence and license tests
        run: python -m unittest discover -s Development_Guardrails/tests -v
      - name: Validate JSON schemas are parseable
        run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('docs/schemas').glob('*.json')]"
  mpfb-real-integration:
    name: Real MPFB Blender 5.3 cloud smoke (MPFB branches only)
    if: ${{ startsWith(github.head_ref, 'ci/mpfb-') || startsWith(github.head_ref, 'feat/mpfb-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run official Blender and MPFB with actual mesh and rig
        shell: bash
        run: bash ci/run_mpfb_cloud_smoke.sh
      - name: Retain only JSON evidence (no proprietary models or Blender files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucc-mpfb-linux-mesh-worker-json
          path: |
            ${{ runner.temp }}/ucc-mpfb-smoke/summary.json
            ${{ runner.temp }}/ucc-mpfb-smoke/mpfb_create_result.json
            ${{ runner.temp }}/ucc-mpfb-smoke/reopen_result.json
            ${{ runner.temp }}/ucc-ucc-worker/production_summary.json
          if-no-files-found: ignore
          retention-days: 3
