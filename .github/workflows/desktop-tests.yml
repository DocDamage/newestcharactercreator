name: Desktop Qt Smoke Tests
on:
  pull_request:
    paths:
      - 'src/ucc/desktop/**'
      - 'src/ucc/core/**'
      - 'src/ucc/preview/**'
      - 'src/ucc/jobs/**'
      - 'src/ucc/animations/target_action_diagnostic*.py'
      - 'src/ucc/export/**'
      - 'tests/test_*qt.py'
      - 'tests/fixtures/**'
      - 'tests/test_motion_*.py'
      - 'tests/test_desktop_*.py'
      - 'tests/test_unity_export_dialog.py'
      - 'tests/test_unity_export_desktop.py'
      - 'tests/test_target_action_dialog.py'
      - 'tests/test_target_action_desktop.py'
      - 'tests/test_target_action_preview_window.py'
      - 'tests/test_godot_saved_preview*.py'
      - 'tests/test_target_action_diagnostic*.py'
      - 'tests/test_unreal_export_dialog.py'
      - 'tests/test_unreal_export_desktop.py'
      - 'pyproject.toml'
      - '.github/workflows/desktop-tests.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qt-offscreen:
    name: PySide6 offscreen / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      UCC_REQUIRE_QT: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime libraries (offscreen)
        if: runner.os == 'Linux'
        run: |
          timeout 120s sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install Qt dependencies
        run: python -m pip install "PySide6>=6.8,<7"
      - name: Validate desktop source imports
        run: python -m compileall -q src/ucc/desktop
      - name: Fail early if PySide6 UI cannot be imported
        run: python -c "from PySide6.QtWidgets import QApplication; from ucc.desktop.window import MainWindow"
      - name: Run real offscreen Qt widgets
        run: python -m unittest discover -s tests -p test_desktop_qt.py -v
      - name: Run facial intent, save, history and cancellation controls (no skips)
        run: python -m unittest discover -s tests -p test_face_qt.py -v
      - name: Run actual GLB mesh viewport widget tests (no skips)
        run: python -m unittest discover -s tests -p test_preview_qt.py -v
      - name: Run cached-motion Qt transport and error tests (no GPU claim)
        run: python -m unittest discover -s tests -p test_motion_qt.py -v
      - name: Run original/fitted publication and bound-input watcher tests
        run: python -m unittest discover -s tests -p test_fitted_comparison_qt.py -v
      - name: Run measured-contact fitting action and rejection tests
        run: python -m unittest discover -s tests -p test_contact_fit_qt.py -v
      - name: Run body-contact action and annotation publication tests
        run: python -m unittest discover -s tests -p test_body_review_qt.py -v
      - name: Run prepared reference body and face controls, exact history and busy locks
        run: python -m unittest discover -s tests -p test_reference_master_qt.py -v
      - name: Run referenced expression dispatch, publication and source policy watchers
        run: python -m unittest discover -s tests -p test_reference_expression_qt.py -v
      - name: Run dependency-free controller tests
        run: python -m unittest discover -s tests -p test_desktop_controller.py -v
      - name: Run Unity per-use review dialog tests (real Qt, no skips)
        run: python -m unittest discover -s tests -p test_unity_export_dialog.py -v
      - name: Run Unity desktop export workflow tests (real Qt, no engine claim)
        run: python -m unittest discover -s tests -p test_unity_export_desktop.py -v
      - name: Run registered target private-preview review tests (real Qt)
        run: python -m unittest discover -s tests -p test_target_action_dialog.py -v
      - name: Run target saved-load and preview lifetime tests (no Blender claim)
        run: python -m unittest discover -s tests -p test_target_action_desktop.py -v
      - name: Run bounded registered preview window controls (real Qt, no skips)
        run: python -m unittest discover -s tests -p test_target_action_preview_window.py -v
      - name: Run saved Godot captured-image widgets (real Qt, no skips)
        run: python -m unittest discover -s tests -p test_godot_saved_preview_widget.py -v
      - name: Run saved Godot consent and viewer lifetime tests (real Qt, no skips)
        run: python -m unittest discover -s tests -p test_godot_saved_preview_workflow.py -v
      - name: Run registered clip diagnostic report tests (real Qt, no skips)
        run: python -m unittest discover -s tests -p test_target_action_diagnostic_dialog.py -v
      - name: Run diagnostic watch, consent and lifetime tests (real Qt, no skips)
        run: python -m unittest discover -s tests -p test_target_action_diagnostic_workflow.py -v
      - name: Run diagnostic desktop routing and cancellation tests (real Qt, no skips)
        run: python -m unittest discover -s tests -p test_target_action_diagnostic_integration.py -v
      - name: Run Unreal per-use review dialog tests (real Qt, no skips)
        run: python -m unittest discover -s tests -p test_unreal_export_dialog.py -v
      - name: Run Unreal desktop static export workflow tests (real Qt, no engine claim)
        run: python -m unittest discover -s tests -p test_unreal_export_desktop.py -v
