name: Windows desktop alpha build (internal testing)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/ucc/desktop/**'
      - 'src/ucc/preview/**'
      - 'src/ucc/core/**'
      - 'src/ucc/jobs/**'
      - 'blender_bridge/**'
      - 'engine_adapters/godot/**'
      - 'engine_adapters/unity/**'
      - 'engine_adapters/unreal/**'
      - 'ci/build_worker_payload.py'
      - 'src/ucc/animations/**'
      - 'src/ucc/ai/**'
      - 'src/ucc/export/**'
      - 'src/ucc/library/**'
      - 'src/ucc/sprites/**'
      - 'tests/test_desktop_entrypoint.py'
      - 'tests/test_target_action_dialog.py'
      - 'tests/test_target_action_desktop.py'
      - 'tests/test_target_action_preview_window.py'
      - 'tests/test_idle_loop_renderer_qt.py'
      - 'tests/test_authored_idle_authoring*.py'
      - 'tests/test_registered_native*_qt.py'
      - 'tests/test_godot_saved_preview*.py'
      - 'tests/test_godot_animation_export_desktop.py'
      - 'tests/test_unity_animation_export_desktop.py'
      - 'tests/test_unreal_animation_export_desktop.py'
      - 'tests/test_body_sprite_desktop.py'
      - 'tests/test_body_sprite_dialog.py'
      - 'tests/test_target_action_diagnostic*.py'
      - 'pyproject.toml'
      - '.github/workflows/windows-alpha-package.yml'
  push:
    branches: [main]
    paths:
      - 'ci/build_worker_payload.py'
      - 'src/ucc/core/worker_payload.py'
      - 'src/ucc/jobs/worker_resources.py'
      - 'engine_adapters/godot/registered_correction/**'
      - 'engine_adapters/godot/registered_body300/**'
      - 'engine_adapters/godot/registered_playback/**'
      - 'src/ucc/animations/target_action_diagnostic*.py'
      - 'src/ucc/jobs/target_action_diagnostic*.py'
      - 'src/ucc/preview/playback_window.py'
      - 'tests/test_target_action_preview_window.py'
      - 'tests/test_registered_native*_qt.py'
      - '.github/workflows/windows-alpha-package.yml'
      - 'src/ucc/desktop/**'
      - 'pyproject.toml'
      - 'tests/test_godot_saved_preview*.py'
      - 'tests/test_target_action_diagnostic*.py'

permissions:
  contents: read

jobs:
  build-alpha:
    name: Windows x64 portable GUI
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      UCC_REQUIRE_QT: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit alpha dependencies and packager
        run: python -m pip install -e ".[desktop,sprites]" "pyinstaller>=6.13,<7"
      - name: Run real Qt self-test before freezing
        shell: pwsh
        run: |
          python -m ucc.desktop --self-test --self-test-report "$PWD/source-health.json"
          if ($LASTEXITCODE -ne 0) { throw "Source app self-test failed" }
          $health = Get-Content "$PWD/source-health.json" -Raw | ConvertFrom-Json
          if ($health.status -ne 'SELF_TEST_OK' -or $health.checks.Count -ne 3) {
            throw 'Qt/project source self-test did not pass both checks'
          }
      - name: Desktop import and UI tests (real Qt, not skipped)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_desktop_qt.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Qt UI tests failed' }
          python -m unittest discover -s tests -p 'test_desktop_entrypoint.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Qt diagnostic tests failed' }
          python -m unittest discover -s tests -p 'test_motion_qt.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Cached motion transport tests failed' }
          python -m unittest discover -s tests -p 'test_registered_native_workflow_qt.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Registered native selection and cancellation tests failed' }
          python -m unittest discover -s tests -p 'test_registered_native_playback_qt.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Registered native skin authority and lifetime tests failed' }
          python -m unittest discover -s tests -p 'test_unity_export_dialog.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Unity per-use review dialog tests failed' }
          python -m unittest discover -s tests -p 'test_unity_export_desktop.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Unity desktop export workflow tests failed' }
          python -m unittest discover -s tests -p 'test_unity_animation_export_desktop.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Private Unity animation export workflow tests failed' }
          python -m unittest discover -s tests -p 'test_unreal_animation_export_desktop.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Private Unreal animation export workflow tests failed' }
          python -m unittest discover -s tests -p 'test_body_sprite_dialog.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Private body sprite dialog tests failed' }
          python -m unittest discover -s tests -p 'test_body_sprite_desktop.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Private body sprite export workflow tests failed' }
          python -m unittest discover -s tests -p 'test_export_compatibility_report.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Export compatibility report tests failed' }
          python -m unittest discover -s tests -p 'test_target_action_dialog.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Target private-preview review tests failed' }
          python -m unittest discover -s tests -p 'test_target_action_desktop.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Target saved-load and preview lifetime tests failed' }
          python -m unittest discover -s tests -p 'test_target_action_preview_window.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Registered preview window control tests failed' }
          python -m unittest discover -s tests -p 'test_idle_loop_renderer_qt.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Guarded idle loop rendering tests failed' }
          python -m unittest discover -s tests -p 'test_authored_idle_authoring*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Original idle authoring workflow tests failed' }
          python -m unittest discover -s tests -p 'test_godot_saved_preview_widget.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Saved Godot captured-image widget tests failed' }
          python -m unittest discover -s tests -p 'test_godot_saved_preview_workflow.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Saved Godot consent and viewer lifetime tests failed' }
          python -m unittest discover -s tests -p 'test_godot_animation_export_desktop.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Private Godot animation export workflow tests failed' }
          python -m unittest discover -s tests -p 'test_target_action_diagnostic_dialog.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Registered clip diagnostic report tests failed' }
          python -m unittest discover -s tests -p 'test_target_action_diagnostic_workflow.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic watch, consent and lifetime tests failed' }
          python -m unittest discover -s tests -p 'test_target_action_diagnostic_integration.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic desktop routing and cancellation tests failed' }
          python -m unittest discover -s tests -p 'test_unreal_export_dialog.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Unreal per-use review dialog tests failed' }
          python -m unittest discover -s tests -p 'test_unreal_export_desktop.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Unreal desktop static export workflow tests failed' }
      - name: Freeze windowed desktop application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          python ci/build_worker_payload.py --repo "$PWD" --destination "$PWD/build/ucc-worker-payload"
          if ($LASTEXITCODE -ne 0) { throw 'Isolated worker payload build failed' }
          # Qt must use Windows' ICU, not an unrelated SDK's same-name DLL.
          $taskPython = (Get-Command python).Source
          $env:PATH = @((Split-Path $taskPython), "$env:SystemRoot\System32", $env:SystemRoot) -join ';'
          & $taskPython -m PyInstaller --clean --noconfirm --onedir --windowed `
            --name UCC-Desktop-Alpha --paths src `
            --add-data 'build/ucc-worker-payload/blender_bridge;blender_bridge' `
            --add-data 'build/ucc-worker-payload/worker_support;worker_support' `
            src/ucc/desktop/__main__.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
      - name: Test the frozen executable and confirm JSON evidence
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/UCC-Desktop-Alpha/UCC-Desktop-Alpha.exe'
          if (-not (Test-Path $exe)) { throw "Frozen executable missing: $exe" }
          # Windows GUI-subsystem EXEs do not reliably populate $LASTEXITCODE from '&' in pwsh.
          # Start-Process -Wait -PassThru returns a real process ExitCode.
          $report = Join-Path $PWD 'frozen-health.json'
          $args = '--self-test --self-test-report "' + $report + '"'
          $process = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen GUI self-test failed (exit $($process.ExitCode))" }
          if (-not (Test-Path "$PWD/frozen-health.json")) { throw 'Frozen health report missing' }
          $health = Get-Content "$PWD/frozen-health.json" -Raw | ConvertFrom-Json
          if ($health.status -ne 'SELF_TEST_OK') { throw 'Frozen self-test did not pass' }
          if ($health.checks.Count -ne 3) { throw 'Frozen self-test did not exercise project, Qt widgets and bundled Blender bridge' }
          Write-Output 'FROZEN_QT_AND_PROJECT_ROUNDTRIP_VERIFIED'
          # Exercise the real standalone --catalog entry point, not only imports
          # through python -m. Invalid selection must exit before creating a GUI.
          $catalogPath = Join-Path $PWD 'build/absent-catalog-for-validation.sqlite3'
          if (Test-Path -LiteralPath $catalogPath) { throw 'Negative catalog fixture unexpectedly exists' }
          $catalogArgs = '--catalog "' + $catalogPath + '"'
          $catalogProcess = Start-Process -FilePath $exe -ArgumentList $catalogArgs -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput "$PWD/build/catalog-validation.stdout.log" `
            -RedirectStandardError "$PWD/build/catalog-validation.stderr.log"
          if (-not $catalogProcess.WaitForExit(30000)) {
            $catalogProcess.Kill($true)
            [void]$catalogProcess.WaitForExit(10000)
            throw 'Frozen --catalog validation hung or displayed an exception dialog'
          }
          if ($catalogProcess.ExitCode -ne 2) { throw "Frozen --catalog invalid selection returned $($catalogProcess.ExitCode)" }
          if (Test-Path -LiteralPath $catalogPath) { throw 'Frozen --catalog created the missing database' }
          Write-Output 'FROZEN_EXPLICIT_CATALOG_VALIDATION_VERIFIED'
      - name: Retain self-test JSON on failure for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ucc-frozen-self-test-failure
          path: frozen-health.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Create SHA-256 checked internal QA archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item 'docs/packaging/WINDOWS_ALPHA_README.md' 'dist/UCC-Desktop-Alpha/READ_THIS_FIRST.md'
          $archive = 'release/UCC-Desktop-Alpha-windows-x64.zip'
          Compress-Archive -Path 'dist/UCC-Desktop-Alpha' -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'release/SHA256SUMS.txt' -Value "$hash  UCC-Desktop-Alpha-windows-x64.zip" -Encoding ascii
          Copy-Item 'frozen-health.json' 'release/frozen-health.json'
          if ((Get-Item $archive).Length -lt 1000000) { throw 'Archive suspiciously small' }
      - name: Upload ephemeral internal-test artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: UCC-Desktop-Alpha-Windows-x64
          path: release/*
          retention-days: 7
          if-no-files-found: error
