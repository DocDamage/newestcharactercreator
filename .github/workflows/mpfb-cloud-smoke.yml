permissions:
  contents: read

concurrency:
  group: mpfb-cloud-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mpfb-linux:
    name: ${{ matrix.suite == 'regression' && 'verify-mpfb-linux' || matrix.suite == 'native-fit' && 'verify-native-fit-linux' || 'verify-body-contacts-linux' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [regression, native-fit, body-contacts]
    # The full 300-frame neutral-reference regression completed at the old
    # 25-minute job boundary (including tool setup), cancelling a passing run.
    # Keep every integration assertion and allow bounded setup/runner headroom.
    # PR #49's complete native-fit suite passed in about 39 minutes. The new
    # suite adds two full 300-frame source-contact negatives, run in parallel.
    # Preserve every check and give that suite bounded additional headroom.
    # Stable-face intake adds original-only + paired two-process checks and two
    # full-sequence rehashed-report negatives to the existing ~41-minute suite.
    # Keep all prior gates and bound this additional real integration workload.
    # R's complete native-fit suite passed in about 61 minutes. S adds two
    # original-source full-sequence proposal negatives, run in parallel.
    # Retain all prior assertions and bound the additional integration workload.
    # Closed-skin adds two complete source workers, a full rehashed-report
    # rejection and an independently reopened actual MPFB geometry fault.
    # PR #58's body job was still executing at the verified 60-minute limit.
    # Preserve every full-sequence assertion and allow bounded runner headroom.
    # Complete-trunk review retains the area/enclosure checks and adds coherent
    # native/fitted false-contact reproductions. Keep every assertion and bound
    # the additional actual full-sequence Blender work with explicit headroom.
    # PR #59 reached the verified 75-minute limit after its real geometry
    # faults passed, while remaining native fault checks still ran. Keep every
    # assertion and allow bounded headroom for the complete body suite.
    # PR #59 reached its actual 120-minute wall limit with no assertion
    # failure after the first full hand-policy fault copy was authored. The
    # second hand/body-shape contract and final source-contact negatives remain.
    # Preserve all gates and individual worker limits; bound this suite at 3h.
    timeout-minutes: ${{ matrix.suite == 'native-fit' && 180 || matrix.suite == 'body-contacts' && 90 || 40 }}
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      # Job-level env cannot reference the runner context. Set the isolated
      # paths from RUNNER_TEMP in a running step and persist them for later steps.
      - name: Configure isolated Blender extension directories
        shell: bash
        run: |
          set -euo pipefail
          printf 'BLENDER_USER_CONFIG=%s\n' "$RUNNER_TEMP/ucc-blender-config" >> "$GITHUB_ENV"
          printf 'BLENDER_USER_SCRIPTS=%s\n' "$RUNNER_TEMP/ucc-blender-scripts" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ucc-blender-config" "$RUNNER_TEMP/ucc-blender-scripts"
      - name: Download Blender 5.3.0 and check official SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ucc-blender" "$BLENDER_USER_CONFIG" "$BLENDER_USER_SCRIPTS"
          cd "$RUNNER_TEMP/ucc-blender"
          origin='https://download.blender.org/release/Blender5.3'
          # Unique public requests test the repeated cached-403 failure while
          # retaining the exact official archive path and strict checksum.
          request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.suite }}"
          # The public origin intermittently returns HTTP 403 on individual
          # runners. Default curl retries do not retry that status. Retain the
          # official origin/checksum and bound retries and stalled transfers.
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 10 \
            --connect-timeout 20 --max-time 180 --retry-max-time 360 --silent --show-error \
            "$origin/blender-5.3.0-linux-x64.tar.xz?ucc_ci=$request_id" -o blender-5.3.0-linux-x64.tar.xz
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 10 \
            --connect-timeout 20 --max-time 60 --retry-max-time 180 --silent --show-error \
            "$origin/blender-5.3.0.sha256?ucc_ci=$request_id" -o blender-5.3.0.sha256
          grep -E '^[a-fA-F0-9]{64} [ *]blender-5\.3\.0-linux-x64\.tar\.xz$' blender-5.3.0.sha256 | sha256sum --check --strict
          tar -xf blender-5.3.0-linux-x64.tar.xz
          executable="$(find "$PWD" -maxdepth 3 -type f -name blender | head -n 1)"
          test -n "$executable" && test -x "$executable"
          "$executable" --background --version | head -n 5
          echo "BLENDER_EXE=$executable" >> "$GITHUB_ENV"
      - name: Record pinned Blender download source
        shell: bash
        run: |
          echo "Blender 5.3.0 source: https://download.blender.org/release/Blender5.3/" >> "$GITHUB_STEP_SUMMARY"
          echo "MPFB official extension: https://extensions.blender.org/add-ons/mpfb/" >> "$GITHUB_STEP_SUMMARY"
          echo "Success requires a real mesh, rig, and separate-process reopen; synthetic tests do not count." >> "$GITHUB_STEP_SUMMARY"
      - name: Install only official MPFB Blender extension
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_EXE" --command extension repo-list
          # Use the official Blender Extensions repository. User preferences live only
          # in RUNNER_TEMP; nothing is installed onto a user's workstation.
          "$BLENDER_EXE" --command extension repo-add ucc_blender_org \
             --name 'Blender Extensions' \
             --url 'https://extensions.blender.org/api/v1/extensions/'
          "$BLENDER_EXE" --online-mode --command extension sync
          "$BLENDER_EXE" --command extension repo-info ucc_blender_org
          "$BLENDER_EXE" --online-mode --command extension install -s -e mpfb
          "$BLENDER_EXE" --command extension list | grep -i mpfb
      - name: Run actual MPFB mesh + rig save/reopen test in isolated Blender processes
        shell: bash
        run: |
          set -euo pipefail
          python3 Stage0_Starter/tools/run_mpfb_smoke.py \
              --blender "$BLENDER_EXE" \
              --outdir "$RUNNER_TEMP/ucc-mpfb-smoke" --timeout 300
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'ucc-mpfb-smoke'
          create = json.loads((directory / 'mpfb_create_result.json').read_text())
          reopen = json.loads((directory / 'reopen_result.json').read_text())
          assert create['method'] == 'HumanService'
          assert create['rig_choice'] == 'default'
          assert len(create['rigs']) >= 1 and create['rigs'][0]['bone_count'] >= 5
          assert reopen['status'] == 'ok' and reopen['armature_count'] >= 1
          assert reopen['vertex_count'] > 100 and reopen['bone_count'] >= 5
          print('LINUX SMOKE: actual Blender-produced human + rig saved and reopened')
          print('THIS DOES NOT VERIFY: Windows 5.3, deformation, animation retargeting, or engine import')
          PY
      - name: Verify production Blender JSON worker creates and reopens a humanoid
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_production_worker.py \
            --blender "$BLENDER_EXE" \
            --outdir "$RUNNER_TEMP/ucc-production-worker" --timeout 300
      - name: Verify real MPFB BVH motion and two-landmark quaternion rest calibration
        if: matrix.suite == 'regression'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_project_generation.py \
            --blender "$BLENDER_EXE" \
            --outdir "$RUNNER_TEMP/ucc-project-integration"
      - name: Verify original full-timeline target fitting and real saved-scene corruptions
        if: matrix.suite == 'native-fit'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_native_fit.py \
            --blender "$BLENDER_EXE" \
            --outdir "$RUNNER_TEMP/ucc-native-fit" --contact-candidate-check
      - name: Verify full-sequence hand/head/torso observations and real geometry faults
        if: matrix.suite == 'body-contacts'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_body_contacts.py \
            --blender "$BLENDER_EXE" \
            --outdir "$RUNNER_TEMP/ucc-body-contacts"
      - name: Retain JSON diagnostics only; no assets or .blend in artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-linux-json-diagnostics-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/ucc-mpfb-smoke/summary.json
            ${{ runner.temp }}/ucc-mpfb-smoke/mpfb_create_result.json
            ${{ runner.temp }}/ucc-mpfb-smoke/reopen_result.json
            ${{ runner.temp }}/ucc-production-worker/production_summary.json
            ${{ runner.temp }}/ucc-project-integration/transaction_summary.json
            ${{ runner.temp }}/ucc-native-fit/native_fit_summary.json
            ${{ runner.temp }}/ucc-body-contacts/body_contact_summary.json
          if-no-files-found: ignore
          retention-days: 3
