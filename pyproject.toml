[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ucc-character-core"
version = "0.1.0a1"
description = "Universal Character Creator pre-development core (no graphical editor yet)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sprites = ["Pillow>=11,<13"]

[project.scripts]
ucc = "ucc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
